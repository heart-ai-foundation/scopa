name: Feature request
description: Propose a bounded developer-facing improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: Describe the workflow or assurance gap without prescribing the implementation first.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Scope
        - Completion
        - Continuity
        - Evidence
        - Adapter or integration
        - Packaging or developer experience
        - Documentation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: What should a developer be able to do or verify?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals and assurance impact
      description: State what this should not authorize or claim.
    validations:
      required: true
