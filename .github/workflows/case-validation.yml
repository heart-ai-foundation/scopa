name: SCOPA release gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-case-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/interop/requirements-case-validator.txt

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Reject high-severity dependency advisories
        run: npm audit --audit-level=high

      - name: Install independent CASE validator
        run: python -m pip install -r packages/interop/requirements-case-validator.txt

      - name: Run accumulated SCOPA release gate
        run: npm test

      - name: Prove npm 10 and npm 11 bundled-closure parity
        run: |
          mkdir -p /tmp/scopa-npm10 /tmp/scopa-npm11
          npm install --prefix /tmp/scopa-npm10 --ignore-scripts --no-audit --no-fund npm@10.9.7
          npm install --prefix /tmp/scopa-npm11 --ignore-scripts --no-audit --no-fund npm@11.19.0
          SCOPA_NPM_COMMAND=/tmp/scopa-npm10/node_modules/.bin/npm SCOPA_NPM11_COMMAND=/tmp/scopa-npm11/node_modules/.bin/npm npm run test:s19

      - name: Qualify the four-part bundled candidate identity
        if: ${{ hashFiles('next-prompt-protocols/active/2026-07-31-S20-bundled-exact-candidate-freeze.md') != '' || hashFiles('next-prompt-protocols/active/2026-08-01-S25-fresh-provider-off-candidate-qualification.md') != '' }}
        run: |
          if test -f next-prompt-protocols/active/2026-08-01-S25-fresh-provider-off-candidate-qualification.md; then
            SCOPA_NPM_COMMAND=/tmp/scopa-npm10/node_modules/.bin/npm SCOPA_NPM11_COMMAND=/tmp/scopa-npm11/node_modules/.bin/npm npm run probe:s20:candidate -- --matrix fixtures/S25/deterministic-candidate-matrix.json --artifact-dir /tmp/scopa-s25-candidate --output /tmp/scopa-s25-qualification.json
          else
            SCOPA_NPM_COMMAND=/tmp/scopa-npm10/node_modules/.bin/npm SCOPA_NPM11_COMMAND=/tmp/scopa-npm11/node_modules/.bin/npm npm run probe:s20:candidate -- --artifact-dir /tmp/scopa-s20-candidate --output /tmp/scopa-s20-qualification.json
          fi

      - name: Build through the clean official candidate path
        run: npm run pack:candidate -- --output-directory /tmp/scopa-official-candidate

      - name: Recover and verify the signed native packet
        run: npm run verify:case:s5:artifact

      - name: Validate committed CASE artifact
        run: npm run validate:case:s5

      - name: Prove malformed CASE graph is rejected
        run: npm run validate:case:s5:negative
